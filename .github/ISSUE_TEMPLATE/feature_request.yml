name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [roadmap](https://github.com/Lua-x/crystal/blob/main/ROADMAP.md)
        and existing issues first – maybe it is already planned.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: How could it work?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you considered

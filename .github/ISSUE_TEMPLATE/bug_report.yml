name: Bug report
description: Something does not work as expected.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem! Please search the
        [existing issues](https://github.com/Lua-x/Crystal/issues) first.
        **Security problems:** do not open an issue – see [SECURITY.md](https://github.com/Lua-x/Crystal/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Crystal version
      description: Shown on the sign-in page, or `docker inspect ghcr.io/lua-x/crystal --format '{{ index .Config.Labels "org.opencontainers.image.version" }}'`.
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How do you run Crystal?
      options:
        - Docker Compose
        - Docker (other)
        - Kubernetes
        - From source
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone (iOS 19), Firefox 140 on Windows …

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output of `docker compose logs crystal`. Remove anything private.
      render: text

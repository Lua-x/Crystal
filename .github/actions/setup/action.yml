name: Set up Node.js and dependencies
description: Installs Node.js, the pnpm version pinned in package.json and all dependencies.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version-file: .node-version
        # setup-node would try to cache via pnpm before pnpm is installed;
        # the pnpm store is cached below instead.
        package-manager-cache: false

    - name: Install pnpm
      shell: bash
      run: npm install --global --no-fund --no-audit "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

    - name: Locate the pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
